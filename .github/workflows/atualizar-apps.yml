name: Atualizar apps no perfil

on:
  schedule:
    # 14:17 UTC = 11:17 America/Sao_Paulo
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-apps-clave-sol
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        run: python -m unittest discover -s tests -v

      - name: Regenerar elementos gráficos estáticos
        run: python scripts/build_assets.py

      - name: Atualizar cartões a partir do site
        run: python scripts/sync_apps.py

      - name: Publicar somente quando houver novidades
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- README.md assets/
          if git diff --cached --quiet; then
            echo 'Nenhuma mudança nos aplicativos ou assets.'
            ultimo=$(git log -1 --format=%ct)
            agora=$(date +%s)
            if [ "$((agora - ultimo))" -ge "$((35*86400))" ]; then
              git commit --allow-empty -m 'chore: manter agenda ativa'
              git push
            fi
            exit 0
          fi
          git commit -m 'docs: atualizar vitrine Clave Sol'
          git push
