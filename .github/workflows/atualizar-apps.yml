name: Atualizar apps no perfil

on:
  # 14:17 UTC = 11:17 em Brasília / São Paulo (UTC-3)
  schedule:
    - cron: "17 14 * * *"
  # Também permite a execução imediata pela aba Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-apps-perfil
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        run: python -m unittest discover -s tests -v

      - name: Consultar Clave Sol e atualizar README
        run: python scripts/sync_apps.py

      - name: Publicar apenas se houver mudanças
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- README.md; then
            echo "Nenhuma novidade no catálogo."
            # GitHub desativa agendamentos em repositórios públicos sem
            # atividade por 60 dias. Faz 1 commit vazio a cada ~35 dias
            # de inatividade; nunca gera alterações diárias desnecessárias.
            ultimo_commit=$(git log -1 --format=%ct)
            agora=$(date +%s)
            idade=$((agora - ultimo_commit))
            if [ "$idade" -lt $((35 * 24 * 60 * 60)) ]; then
              echo "Nenhum commit necessário."
              exit 0
            fi
            git commit --allow-empty -m "chore: mantém atualização agendada ativa"
          else
            git add README.md
            git commit -m "docs: atualiza catálogo de apps Clave Sol"
          fi
          git push
